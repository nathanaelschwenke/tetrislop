name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Erlaubt den manuellen Start über den "Run workflow" Button

# Erlaubt GitHub Actions, die Seite auf Pages zu veröffentlichen
permissions:
  contents: read
  pages: write
  id-token: write

# Verhindert, dass zwei Deployments gleichzeitig laufen
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Vite App
        working-directory: ./frontend
        run: npm run build
        # Hier injizieren wir deine Secrets, damit Vite sie fest in den Code einbaut
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
